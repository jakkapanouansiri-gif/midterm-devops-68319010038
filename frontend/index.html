<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกข้อมูลเครื่องคอมพิวเตอร์ประจำห้อง</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 24px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 4px 0;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      margin-right: 6px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #6b7280;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f3f4f6;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ระบบบันทึกข้อมูลเครื่องคอมพิวเตอร์ประจำห้อง</h1>
  <p>ผู้จัดทำ: นาย จักรพันธ์ อ้วนศิริ</p>
  <p>รหัสนักศึกษา: 68319010038</p>
</header>

<main>

  <section class="card">
    <h2 id="form-title">เพิ่มข้อมูลคอมพิวเตอร์</h2>

    <form id="computer-form">

      <input type="hidden" id="computer-id">

      <div class="form-grid">

        <div>
          <label>รหัสทรัพย์สิน</label>
          <input id="asset_code" required>
        </div>

        <div>
          <label>ยี่ห้อ / รุ่น</label>
          <input id="brand_model" required>
        </div>

        <div>
          <label>CPU</label>
          <input id="cpu" required>
        </div>

        <div>
          <label>RAM (GB)</label>
          <input id="ram_gb" type="number" min="1" required>
        </div>

        <div>
          <label>ห้อง</label>
          <input id="room" required>
        </div>

        <div>
          <label>สถานะ</label>
          <select id="status" required>
            <option value="ใช้งาน">ใช้งาน</option>
            <option value="ส่งซ่อม">ส่งซ่อม</option>
            <option value="จำหน่าย">จำหน่าย</option>
          </select>
        </div>

      </div>

      <br>

      <button class="primary" type="submit">บันทึกข้อมูล</button>
      <button class="secondary" type="button" onclick="resetForm()">ยกเลิก</button>

    </form>
  </section>

  <section class="card">

    <h2>รายการคอมพิวเตอร์</h2>

    <button class="primary" onclick="loadComputers()">
      รีเฟรชข้อมูล
    </button>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>รหัสทรัพย์สิน</th>
          <th>ยี่ห้อ / รุ่น</th>
          <th>CPU</th>
          <th>RAM</th>
          <th>ห้อง</th>
          <th>สถานะ</th>
          <th>จัดการ</th>
        </tr>
      </thead>

      <tbody id="computer-list"></tbody>
    </table>

  </section>

</main>

<script src="app.js"></script>

</body>
</html>
